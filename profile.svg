      <!-- row 1 -->
      <g>
        <rect x="500" y="404" width="76" height="30" rx="15" fill="#0B1220" stroke="#7C3AED" stroke-opacity="0.6" filter="url(#d-glow)"/>
        <text x="538" y="423" text-anchor="middle">Go</text>
      </g>
      <g>
        <rect x="584" y="404" width="92" height="30" rx="15" fill="#0B1220" stroke="#22D3EE" stroke-opacity="0.6" filter="url(#d-glow)"/>
