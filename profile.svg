        <animate attributeName="opacity" to="1" dur="0.4s" begin="0.6s" fill="freeze"/>
      </text>
      <text x="500" y="268" opacity="0" fill="#94A3B8">BACKGROUND<tspan fill="#F8FAFC" dx="10">Self-taught engineer</tspan>
        <animate attributeName="opacity" to="1" dur="0.4s" begin="1.0s" fill="freeze"/>
      </text>
      <text x="500" y="296" opacity="0" fill="#94A3B8">FOCUS<tspan fill="#F8FAFC" dx="10">ASDL Hub — infra platform</tspan>
        <animate attributeName="opacity" to="1" dur="0.4s" begin="1.4s" fill="freeze"/>
