  <rect x="468" y="24" width="688" height="562" rx="20" fill="url(#d-glass)"/>

  <g clip-path="url(#d-right-clip)">
    <circle cx="500" cy="56" r="6" fill="#EF4444" opacity="0.85"/>
    <circle cx="522" cy="56" r="6" fill="#F59E0B" opacity="0.85"/>
    <circle cx="544" cy="56" r="6" fill="#10B981" opacity="0.85"/>
    <text x="1128" y="61" text-anchor="end" font-family="Consolas, monospace" font-size="12" fill="#94A3B8">asadullah@dev ~ </text>
    <line x1="500" y1="78" x2="1128" y2="78" stroke="#FFFFFF" stroke-opacity="0.08"/>

    <text x="500" y="118" font-family="Consolas, monospace" font-size="30" font-weight="700" fill="#F8FAFC">Hi <tspan>👋</tspan></text>
    <text x="500" y="156" font-family="Consolas, monospace" font-size="26" font-weight="700" fill="url(#d-accent)">I'm Muhammad Asadullah</text>

    <text x="500" y="196" font-family="Consolas, monospace" font-size="19" fill="#22D3EE">&gt;</text>
    <g font-family="Consolas, monospace" font-size="19" fill="#F8FAFC">
      <clipPath id="d-type1"><rect x="518" y="182" height="20" width="0"><animate attributeName="width" values="0;250;250;0;0;0;0;0;0;0" keyTimes="0;0.04;0.16;0.2;1" begin="0s" dur="20s" repeatCount="indefinite"/></rect></clipPath>
      <text x="518" y="196" clip-path="url(#d-type1)">Backend Engineer</text>

      <clipPath id="d-type2"><rect x="518" y="182" height="20" width="0"><animate attributeName="width" values="0;0;0;0;235;235;0;0;0;0" keyTimes="0;0.2;0.24;0.36;0.4;1" begin="0s" dur="20s" repeatCount="indefinite"/></rect></clipPath>
      <text x="518" y="196" clip-path="url(#d-type2)">Full Stack Developer</text>

      <clipPath id="d-type3"><rect x="518" y="182" height="20" width="0"><animate attributeName="width" values="0;0;0;0;0;0;270;270;0;0" keyTimes="0;0.4;0.44;0.56;0.6;1" begin="0s" dur="20s" repeatCount="indefinite"/></rect></clipPath>
      <text x="518" y="196" clip-path="url(#d-type3)">Open Source Contributor</text>

      <clipPath id="d-type4"><rect x="518" y="182" height="20" width="0"><animate attributeName="width" values="0;0;0;0;0;0;0;0;180;180" keyTimes="0;0.6;0.64;0.76;0.8;0.99" begin="0s" dur="20s" repeatCount="indefinite"/></rect></clipPath>
      <text x="518" y="196" clip-path="url(#d-type4)">Infra Engineer</text>
