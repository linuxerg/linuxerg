      <text x="500" y="324" opacity="0" fill="#94A3B8">PORTFOLIO<tspan fill="#22D3EE" dx="10">asdl.website</tspan>
        <animate attributeName="opacity" to="1" dur="0.4s" begin="1.8s" fill="freeze"/>
      </text>
      <text x="500" y="352" opacity="0" fill="#94A3B8">EMAIL<tspan fill="#22D3EE" dx="10">asadullah@asdl.website</tspan>
        <animate attributeName="opacity" to="1" dur="0.4s" begin="2.2s" fill="freeze"/>
      </text>
    </g>

    <text x="500" y="392" font-family="Consolas, monospace" font-size="13" fill="#94A3B8">SKILLS</text>

